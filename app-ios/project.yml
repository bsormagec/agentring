# XcodeGen spec for the agentring iOS app. The .xcodeproj is generated, not committed:
#   brew install xcodegen && xcodegen generate
# Bundle id and signing team come from Config/*.xcconfig (+ the git-ignored
# Config/Local.xcconfig); see README.md.
name: Agentring

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

packages:
  AgentringCore:
    path: AgentringCore
  LiveKit:
    # Pinned exactly (dependency policy in CLAUDE.md: releases at least ~2 weeks old).
    # 2.19.0 was tagged 2026-10-27.
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.19.0

targets:
  Agentring:
    type: application
    platform: iOS
    sources:
      - path: Agentring
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Agentring
        PRODUCT_BUNDLE_IDENTIFIER: $(AGENTRING_BUNDLE_ID)
        INFOPLIST_FILE: Agentring/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Agentring/Agentring.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - package: AgentringCore
        product: AgentringCore
      - package: LiveKit
        product: LiveKit
      - target: AgentringNotificationService
        embed: true
        codeSign: true

  AgentringNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentringNotificationService
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: AgentringNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: $(AGENTRING_BUNDLE_ID).NotificationService
        INFOPLIST_FILE: AgentringNotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: AgentringNotificationService/AgentringNotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - package: AgentringCore
        product: AgentringCore

schemes:
  Agentring:
    build:
      targets:
        Agentring: all
        AgentringNotificationService: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
